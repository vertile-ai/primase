[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helicase-bench"
version = "0.1.0"
description = "Helicase: a unified, resumable benchmark harness over Harbor, Pier, and pluggable backends."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Vertile AI" }]
keywords = ["benchmark", "harness", "harbor", "pier", "agents", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.5", "pyyaml>=6"]

[project.optional-dependencies]
# Backends shell out to the Harbor / Pier CLIs (install those separately).
# The extras exist so `pip install helicase-bench[harbor]` / `[pier]` is the
# documented way to opt into a backend; they also reserve the extra names.
harbor = []
pier = []
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "types-PyYAML"]

[project.urls]
Homepage = "https://github.com/vertile-ai/helicase"
Repository = "https://github.com/vertile-ai/helicase"
Issues = "https://github.com/vertile-ai/helicase/issues"

[project.scripts]
helicase = "helicase.cli:main"

[project.entry-points."helicase.backends"]
harbor = "helicase.backends.harbor:HarborBackend"
pier = "helicase.backends.pier:PierBackend"

[tool.hatch.build.targets.wheel]
packages = ["src/helicase"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
packages = ["helicase"]
pretty = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
